<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Themen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Themen-Cockpit</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#EDF0EC;--panel:#FFFFFF;--ink:#16232E;--muted:#5A6873;--line:#D5DBD7;
  --accent:#0D6770;--accent-ink:#FFFFFF;--soft:#E1E7E4;
  --g:#2E8857;--y:#CF9700;--r:#C2413A;--hdr:rgba(237,240,236,.9);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B;--panel:#17212A;--ink:#E3E9EC;--muted:#92A1AA;--line:#283640;
    --accent:#4BB0B9;--accent-ink:#04181A;--soft:#1F2C35;
    --g:#4DB07D;--y:#E3B53A;--r:#E46258;--hdr:rgba(14,21,27,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B;--panel:#17212A;--ink:#E3E9EC;--muted:#92A1AA;--line:#283640;
  --accent:#4BB0B9;--accent-ink:#04181A;--soft:#1F2C35;
  --g:#4DB07D;--y:#E3B53A;--r:#E46258;--hdr:rgba(14,21,27,.9);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
h1,h2,.mteam,.big,.btn,.tabs button,.chip,.segb{font-family:"Avenir Next Condensed","Arial Narrow",-apple-system,BlinkMacSystemFont,sans-serif}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em}
main{max-width:680px;margin:0 auto;padding:18px 16px 84px}
h2{font-size:21px;font-weight:700;margin:0 0 10px}
.block{margin:0 0 28px}
.block p{margin:0 0 10px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding:2px 6px calc(2px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:136px;border:0;background:none;color:var(--muted);font-size:15px;font-weight:600;padding:13px 2px 11px;position:relative;cursor:pointer}
.tabs button.on{color:var(--accent)}
.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:var(--r);color:#fff;font:600 12px/18px -apple-system,BlinkMacSystemFont,sans-serif;vertical-align:1px}

.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;min-height:44px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.red{color:var(--r)}
.btn.sm{font-size:16px;padding:6px 12px;min-height:38px;border-radius:10px}
.btn.wide{width:100%;display:block}
.top-acts{display:flex;gap:8px;align-items:center}
.btn.icon{padding:6px 10px;display:inline-flex;align-items:center;justify-content:center}
mark{background:color-mix(in srgb,var(--y) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.srh{font-size:17px;margin:18px 0 8px}
.btn:disabled{opacity:.4;cursor:default}
.link{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:10px 0;cursor:pointer}

.matrix{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mrow{border-top:1px solid var(--line);padding:11px 14px 13px}
.mrow:first-child{border-top:0}
.mteam{width:100%;border:0;background:none;color:var(--ink);text-align:left;font-size:18px;font-weight:600;padding:0 0 9px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;cursor:pointer;line-height:1.2;overflow-wrap:anywhere;min-width:0}
.mteam span{flex:0 0 auto;white-space:nowrap}
.mteam span{color:var(--muted);font-weight:500;font-size:16px}
.dots{display:flex;flex-wrap:wrap;gap:9px;padding:0}
.dot{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--g)}
.dot.s-y{background:var(--y)}.dot.s-r{background:var(--r)}
.dot.flag{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.legend{font-size:13px;color:var(--muted);margin:10px 2px 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--g)}
.legend i.s-y{background:var(--y)}.legend i.s-r{background:var(--r)}
.legend i.flag{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 12px;color:var(--ink);font:inherit;cursor:pointer}
.bar{flex:0 0 5px;border-radius:3px;background:var(--g)}
.bar.s-y{background:var(--y)}.bar.s-r{background:var(--r)}
.ib{display:flex;flex-direction:column;gap:2px;min-width:0}
.it{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.im{color:var(--muted);font-size:14px}
.in{font-size:15px;overflow-wrap:anywhere}
.in.miss{color:var(--muted);font-style:italic}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--ink)}
.tag.over{background:color-mix(in srgb,var(--r) 15%,transparent);color:var(--r)}
.tag.me{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.tag.stale{background:color-mix(in srgb,var(--y) 22%,transparent)}
.tag.dead{background:color-mix(in srgb,var(--y) 32%,transparent);font-weight:600}
.calbox{background:var(--soft);border-radius:12px;padding:12px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px 10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.kpi b{display:block;font-family:"Avenir Next Condensed","Arial Narrow",-apple-system,sans-serif;font-size:36px;font-weight:700;line-height:1.05}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.r b{color:var(--r)}.kpi.f b{color:#9A7000}.kpi.m b{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.f b{color:var(--y)}}
:root[data-theme="dark"] .kpi.f b{color:var(--y)}
.kpi.zero b{color:var(--muted)}
.focus{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 6px;margin-bottom:16px}
.fitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.sd{display:inline-block;flex:0 0 12px;width:12px;height:12px;border-radius:50%;background:var(--g)}
.sd.s-y{background:var(--y)}.sd.s-r{background:var(--r)}
.fnot{font-size:14px;color:var(--muted);border-top:1px solid var(--line);margin:0;padding:10px 0 8px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);font-weight:500;font-size:16px;margin:0}
.chk input{width:22px;height:22px;margin:2px 0 0;flex:0 0 auto}
.goals{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grow{display:grid;grid-template-columns:minmax(0,1fr) 72px 28px;gap:10px;align-items:center;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.grow:first-child{border-top:0}
.gt{font-weight:600;overflow-wrap:anywhere}
.gbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent)}
.grow.none .gt{color:var(--muted);font-weight:500}.grow.none .gbar i{background:var(--muted)}
.gn{text-align:right;color:var(--muted);font-size:15px}
.pname{font-size:30px;margin:4px 0 2px;overflow-wrap:anywhere}
.ptadd{display:flex;gap:8px;margin-bottom:10px}
.ptadd input[type=text]{margin:0;flex:1;background:var(--panel)}
.pts{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pt{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-top:1px solid var(--line)}
.pt:first-child{border-top:0}
.pt span{flex:1;overflow-wrap:anywhere}
.pt.done span{text-decoration:line-through;color:var(--muted)}
.ptc{flex:0 0 30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--accent-ink);font-weight:700;cursor:pointer;padding:0}
.pt.done .ptc{background:var(--accent);border-color:var(--accent)}
.ptx{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:6px 8px;cursor:pointer}
.tkb{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:2px;cursor:pointer}
.tkb span{flex:0 0 auto}
.tkt{overflow-wrap:anywhere}
.pt.done .tkb span{text-decoration:none}
.pt.done .tkb .tkt{text-decoration:line-through;color:var(--muted)}
.seg.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg4 .segb,.seg3s .segb{font-size:15px;padding:6px 4px;line-height:1.15;min-height:40px}
.segb.nod::before{display:none}
.seg.seg3s{margin-top:8px}
.dcrow{padding:10px 0;border-top:1px solid var(--line)}
.dcrow>span{display:block;font-weight:600;overflow-wrap:anywhere}
.qbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 8px}
.qbtns .btn{font-size:17px;padding:8px 6px}
.today-line{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;font:inherit;color:var(--ink);cursor:pointer}
.today-line .im{display:block;font-weight:400}
details.block summary{font-size:17px}
[hidden]{display:none!important}
.cu-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{margin:0;text-align:center;position:relative}
.wday input{position:absolute;opacity:0;width:1px;height:1px}
.wday span{display:block;padding:10px 0;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:600;font-size:15px;background:var(--bg)}
.wday input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wday input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.calbox .check{margin:10px 0 6px}
.calbox p{margin:0}
.steps{padding-left:22px;margin:0 0 14px}
.steps li{margin-bottom:9px}

.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:16px}
.notice.soft{border-left-color:var(--y)}
.notice p{margin:2px 0 0;color:var(--muted);font-size:15px}
.notice .btn{flex:0 0 auto}
.inbox-hint{display:block;width:100%;text-align:left;background:var(--soft);border:0;border-radius:12px;padding:12px 14px;margin-bottom:16px;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:17px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{font-size:15px;padding:4px 12px}
.row-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

label{display:block;font-size:14px;color:var(--muted);font-weight:600;margin:0 0 14px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=date],input[type=time]{min-height:44px;-webkit-appearance:none;appearance:none}
textarea{resize:vertical}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px;padding:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;cursor:pointer}
.segb::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--g)}
.segb.s-y::before{background:var(--y)}.segb.s-r::before{background:var(--r)}
.segb.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--panel)}
.check{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:500;font-size:16px}
.check input{width:22px;height:22px;margin:0;flex:0 0 auto}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--panel);width:100%;max-width:680px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=time],.sheet input[type=number],.sheet input[type=search],.sheet select,.sheet textarea{background:var(--bg)}
.sheet-acts{display:flex;gap:10px;margin-top:6px}
.sheet-acts .btn{flex:1}
.danger{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.pick{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}

.capture{margin-bottom:22px}
.capture textarea{margin:0 0 10px;background:var(--panel)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note p{margin:0 0 4px;overflow-wrap:anywhere}
.nacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.rvprog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:8px}
.rvprog span{display:block;height:100%;background:var(--accent)}
.rv h2{font-size:27px;margin:6px 0 2px;line-height:1.15;overflow-wrap:anywhere}
.goal{background:var(--soft);border-radius:10px;padding:10px 12px;margin:12px 0}
.rv .fl{margin:10px 0 14px}
.rv-acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:8px}
.big{font-size:60px;font-weight:700;margin:18px 0;line-height:1}
.big span{font-size:21px;font-weight:600;color:var(--muted)}

.empty{text-align:center;padding:48px 12px}
.empty p{color:var(--muted);max-width:34em;margin:0 auto 18px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.calm{color:var(--muted);text-align:center;padding:12px}
.file{position:relative;color:var(--ink);font-size:18px;margin:0 0 10px}
.file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
details summary{color:var(--accent);font-weight:600;padding:8px 0;cursor:pointer}
details textarea{margin-bottom:10px}
.warnbox{background:color-mix(in srgb,var(--r) 14%,var(--panel));border-radius:12px;padding:12px 14px;margin-bottom:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><h1 id="vtitle">Lage</h1><div class="top-acts"><button class="btn sm icon" data-act="search" aria-label="Suchen" title="Suchen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button class="btn pri sm" data-act="quick">+ Erfassen</button></div></div></header>
<main id="main"></main>
<nav class="tabs" aria-label="Bereiche">
  <button data-tab="lage">Lage</button>
  <button data-tab="heute">Heute<span id="ibadge"></span></button>
  <button data-tab="themen">Themen</button>
  <button data-tab="personen">1:1</button>
  <button data-tab="review">Review</button>
  <button data-tab="daten">Daten</button>
</nav>
<div id="sheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet-body"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var storageOk=true;
const KEY='themen-cockpit-v1';
const DEFAULT_TEAMS=['Team A','Team B','Team C','Team D'];
const STALE=21;
const ST={g:'Grün',y:'Gelb',r:'Rot'};
const WAIT={none:'Nichts',decision:'Meine Entscheidung oder Freigabe',promise:'Meine Zusage',others:'Andere (intern oder extern)'};
const REMIND=[[0,'Am Tag der Deadline'],[1,'1 Tag vorher'],[3,'3 Tage vorher'],[7,'1 Woche vorher'],[14,'2 Wochen vorher']];
const TITLES={lage:'Lage',themen:'Themen',personen:'1:1-Gespräche',heute:'Heute',inbox:'Inbox',review:'Review',daten:'Daten'};

let S=load();
let view='lage', teamFilter='Alle', personFilter='Alle', kpiFilter=null, personSel=null, showArchived=false, rv=null, edit=null, pending=null;

function blank(){return{topics:[],inbox:[],lastReview:null,lastExport:null,teams:DEFAULT_TEAMS.slice(),people:{},focus:null,goals:[],tasks:[],day:null,recurring:[]}}
function load(){
  try{
    localStorage.setItem('__tc','1');localStorage.removeItem('__tc');
    const r=localStorage.getItem(KEY);
    if(r){const d=JSON.parse(r);return normalize(d)}
  }catch(e){storageOk=false}
  return blank();
}
function normalize(d){
  const b=blank();
  return{
    topics:Array.isArray(d.topics)?d.topics.filter(t=>t&&t.id&&t.title):[],
    inbox:Array.isArray(d.inbox)?d.inbox.filter(n=>n&&n.id):[],
    lastReview:d.lastReview||b.lastReview,
    lastExport:d.lastExport||b.lastExport,
    teams:(Array.isArray(d.teams)?d.teams.map(x=>String(x).trim()).filter(Boolean):[]).length?d.teams.map(x=>String(x).trim()).filter(Boolean):b.teams,
    people:d.people&&typeof d.people==='object'&&!Array.isArray(d.people)?d.people:{},

function flags(t){
  const f=[];
  const dn=daysUntil(t.deadline);
  if(dn!==null&&(dn<0||dn<=(t.remind??3)))f.push({k:dn<0?'over':'dead',l:dlText(dn)});
  if(t.due&&t.due<today())f.push({k:'over',l:'Meilenstein überschritten'});
  const d=days(t.progressAt);
  if(d!==null&&d>=STALE)f.push({k:'stale',l:d+' Tage ohne Bewegung'});
  if(t.waiting==='decision')f.push({k:'me',l:'Wartet auf deine Entscheidung'});

}

function weekKey(){const d=new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return{key:y+'-W'+w,w:w,y:y}}
function isMine(t){return t.waiting==='decision'||t.waiting==='promise'||(!!t.followUp&&t.followUp<=today())}
function fmtTs(ts){const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getFullYear()).slice(2)}
function hasPerson(n){return Object.prototype.hasOwnProperty.call(S.people,n)}
function ensurePerson(n){if(!hasPerson(n))S.people[n]={points:[],last:null,log:[]};const p=S.people[n];if(!Array.isArray(p.points))p.points=[];if(!Array.isArray(p.log))p.log=[];return p}
function personNames(){const s=new Set();active().forEach(t=>{if(t.owner)s.add(t.owner)});S.tasks.forEach(t=>{if(!t.done&&t.person)s.add(t.person)});Object.keys(S.people).forEach(n=>s.add(n));return[...s].sort((x,y)=>x.localeCompare(y,'de'))}

    const teams=[...new Set(ts.map(t=>t.team))];const tdue=talkDue(n);
    return '<button class="item" data-act="person" data-name="'+esc(n)+'"><span class="bar s-'+(ts.length?ts[0].status:'g')+'"'+(ts.length?'':' style="background:var(--line)"')+'></span><span class="ib"><span class="it">'+esc(n)+'</span><span class="im">'+(teams.length?esc(teams.join(', '))+', ':'')+ts.length+(ts.length===1?' Thema':' Themen')+(open?', '+open+(open===1?' offener Punkt':' offene Punkte'):'')+'</span><span class="im">'+(p&&p.role?esc(p.role)+', ':'')+(p&&p.last?'Letztes Gespräch '+rel(p.last):'Noch kein Gespräch festgehalten')+'</span>'+(tdue&&tdue.over>=0?'<span class="fl"><span class="tag me">1:1 fällig</span></span>':'')+'</span></button>';
  }).join('')+'</div>';
}

/* ---------- Gesprächsrhythmus ---------- */
const RHY=[[0,'Kein fester Rhythmus'],[7,'Jede Woche'],[14,'Alle 2 Wochen'],[21,'Alle 3 Wochen'],[30,'Monatlich'],[42,'Alle 6 Wochen'],[90,'Quartalsweise']];
function rhyLabel(r){const o=RHY.find(x=>x[0]===+r);return o?o[1]:'alle '+r+' Tage'}
function talkDue(n){if(!hasPerson(n))return null;const p=S.people[n];const r=+p.rhythm||0;if(!r)return null;const base=p.last||p.rhythmSince;if(!base)return null;const d=days(base);return{r:r,d:d,over:d-r,next:shiftIso(isoOf(base),r)}}

/* ---------- Suche ---------- */
function snip(text,q){const s=String(text||'');const i=s.toLowerCase().indexOf(q);if(i<0)return null;const a=Math.max(0,i-40),e=Math.min(s.length,i+q.length+60);return(a>0?'…':'')+esc(s.slice(a,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length,e))+(e<s.length?'…':'')}
function firstSnip(fields,q){for(const f of fields){const s=snip(f,q);if(s)return s}return null}
function searchHtml(raw){
  const q=String(raw||'').trim().toLowerCase();
  if(q.length<2)return '<p class="calm">Mindestens zwei Zeichen eingeben. Gesucht wird in Themen, Aufgaben, Personen, 1:1-Verläufen und der Inbox.</p>';
  let h='',total=0;
  const tp=S.topics.map(t=>({t:t,s:firstSnip([t.title,t.goal,t.next,t.notes,t.owner,t.waitNote,t.team],q)})).filter(x=>x.s).sort((a,b)=>((a.t.archived?1:0)-(b.t.archived?1:0))||bySev(a.t,b.t)).slice(0,25);
  if(tp.length){total+=tp.length;h+='<h2 class="srh">Themen</h2><div class="list">'+tp.map(x=>{const t=x.t;const tt=snip(t.title,q);return '<button class="item" data-act="srOpen" data-k="t" data-id="'+t.id+'"><span class="bar s-'+t.status+'"'+(t.archived?' style="background:var(--line)"':'')+'></span><span class="ib"><span class="it">'+(tt||esc(t.title))+'</span><span class="im">'+who(t)+(t.archived?', erledigt':'')+'</span>'+(tt?'':'<span class="in">'+x.s+'</span>')+'</span></button>'}).join('')+'</div>'}
  const tk=S.tasks.map(t=>({t:t,s:firstSnip([t.text,t.person],q)})).filter(x=>x.s).sort((a,b)=>(a.t.done?1:0)-(b.t.done?1:0)).slice(0,25);
  if(tk.length){total+=tk.length;h+='<h2 class="srh">Aufgaben</h2><div class="list">'+tk.map(x=>{const t=x.t;return '<button class="item" data-act="srOpen" data-k="k" data-id="'+t.id+'"><span class="bar" style="background:'+(t.done?'var(--line)':'var(--accent)')+'"></span><span class="ib"><span class="it">'+(snip(t.text,q)||esc(t.text))+'</span><span class="im">'+(t.done?'erledigt':BLABEL[bucketOf(t)])+(t.person?', '+(snip(t.person,q)||esc(t.person)):'')+'</span></span></button>'}).join('')+'</div>'}
  const pp=personNames().map(n=>{const p=hasPerson(n)?S.people[n]:null;const f=[n,p&&p.role];if(p){(p.points||[]).forEach(x=>f.push(x.text));(p.log||[]).forEach(l=>{f.push(l.text);(l.points||[]).forEach(z=>f.push(z))})}return{n:n,p:p,s:firstSnip(f,q)}}).filter(x=>x.s).slice(0,25);
  if(pp.length){total+=pp.length;h+='<h2 class="srh">Personen und 1:1</h2><div class="list">'+pp.map(x=>{const nn=snip(x.n,q);return '<button class="item" data-act="srOpen" data-k="p" data-name="'+esc(x.n)+'"><span class="bar" style="background:var(--accent)"></span><span class="ib"><span class="it">'+(nn||esc(x.n))+'</span>'+(x.p&&x.p.role?'<span class="im">'+esc(x.p.role)+'</span>':'')+(nn?'':'<span class="in">'+x.s+'</span>')+'</span></button>'}).join('')+'</div>'}
  const ib=S.inbox.map(n=>({n:n,s:snip(n.text,q)})).filter(x=>x.s).slice(0,25);
  if(ib.length){total+=ib.length;h+='<h2 class="srh">Inbox</h2><div class="list">'+ib.map(x=>'<button class="item" data-act="srOpen" data-k="n"><span class="bar" style="background:var(--muted)"></span><span class="ib"><span class="in">'+x.s+'</span><span class="im">'+rel(x.n.at)+'</span></span></button>').join('')+'</div>'}
  return total?'<p class="im" style="margin:0">'+total+' Treffer</p>'+h:'<p class="calm">Keine Treffer für „'+esc(String(raw).trim())+'“.</p>';
}

/* ---------- Aufgaben ---------- */
const BLABEL={today:'Heute',tomorrow:'Morgen',week:'Diese Woche',later:'Später'};
function isoOf(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekEndIso(){const day=new Date().getDay()||7;return shiftIso(today(),7-day)}
function bucketOf(t){const td=today();if(!t.when)return'later';if(t.flex)return t.when<td?'today':'week';if(t.when<=td)return'today';if(t.when===shiftIso(td,1))return'tomorrow';return t.when<=weekEndIso()?'week':'later'}
function setWhen(t,b){if(b==='today'){t.when=today();t.flex=false}else if(b==='tomorrow'){t.when=shiftIso(today(),1);t.flex=false}else if(b==='week'){t.when=weekEndIso();t.flex=true}else{t.when='';t.flex=false}}
function newTask(text,b,extra){const t=Object.assign({id:uid(),text:text,done:false,doneAt:null,created:Date.now(),moves:0,topicId:'',person:''},extra||{});setWhen(t,b);S.tasks.push(t);return t}
function inBucket(b){return S.tasks.filter(t=>!t.done&&bucketOf(t)===b)}
function dayStarted(){return !!(S.day&&S.day.date===today())}
function mustTasks(){return dayStarted()?S.day.must.map(id=>S.tasks.find(t=>t.id===id)).filter(Boolean):[]}
function lines(s){return String(s||'').split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean)}
const FREQ={daily:'Täglich',workdays:'Werktags (Mo bis Fr)',weekly:'Wöchentlich',monthly:'Monatlich',custom:'Individuell'};
const WD=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
function isoDow(iso){return new Date(iso+'T12:00:00').getDay()||7}
function matchesRule(r,iso){const dow=isoDow(iso);if(r.freq==='daily')return true;if(r.freq==='workdays')return dow<=5;if(r.freq==='weekly')return dow===(+r.weekday||1);if(r.freq==='monthly'){const d=new Date(iso+'T12:00:00');const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(+r.monthday||1,dim)}if(r.freq==='custom')return matchesCustom(r,iso);return false}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function ruleDays(r){return Array.isArray(r.days)&&r.days.length?r.days:[isoDow(r.start||today())]}
function matchesCustom(r,iso){const st=r.start||iso;const n=Math.max(1,+r.interval||1);const dd=dayDiff(st,iso);if(dd<0)return false;
  if(r.unit==='week'){if(!ruleDays(r).includes(isoDow(iso)))return false;const wk=Math.round(dayDiff(shiftIso(st,1-isoDow(st)),shiftIso(iso,1-isoDow(iso)))/7);return wk%n===0}
  if(r.unit==='month'){const a=new Date(st+'T12:00:00'),b=new Date(iso+'T12:00:00');const md=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(md<0||md%n!==0)return false;const dim=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();return b.getDate()===Math.min(a.getDate(),dim)}
  return dd%n===0}
function lastOcc(r){const td=today();for(let i=0;i<32;i++){const iso=shiftIso(td,-i);if(matchesRule(r,iso))return iso}return ''}
function ruleText(r){if(r.freq==='custom'){const n=Math.max(1,+r.interval||1);let s;if(r.unit==='week'){s=(n===1?'Jede Woche':'Alle '+n+' Wochen')+' am '+ruleDays(r).slice().sort((a,b)=>a-b).map(i=>WD[i-1].slice(0,2)).join(', ')}else if(r.unit==='month'){s=(n===1?'Jeden Monat':'Alle '+n+' Monate')+' am '+(+String(r.start||today()).slice(8))+'.'}else{s=n===1?'Täglich':'Alle '+n+' Tage'}return s+(r.start&&r.start>today()?', ab '+fmt(r.start):'')}return r.freq==='weekly'?'Jeden '+WD[(+r.weekday||1)-1]:r.freq==='monthly'?'Monatlich am '+(+r.monthday||1)+'.':FREQ[r.freq]}
function genRecurring(){let ch=false;(S.recurring||[]).forEach(r=>{const o=lastOcc(r);if(!o||(r.lastGen&&o<=r.lastGen))return;r.lastGen=o;ch=true;if(S.tasks.some(t=>!t.done&&t.ruleId===r.id))return;const t=newTask(r.text,'today',{topicId:r.topicId||'',person:r.person||'',ruleId:r.id});t.when=o;t.flex=false});if(ch)save()}
function taskRow(t){
  const tp=t.topicId?S.topics.find(x=>x.id===t.topicId):null;const meta=[];
  if(t.ruleId)meta.push('↻ wiederkehrend');if(tp)meta.push(esc(tp.title));if(t.person)meta.push(esc(t.person));
  if(!t.done&&t.when&&t.when<today())meta.push(t.flex?'aus der Vorwoche':'übrig seit '+fmt(t.when));
  if(!t.done&&bucketOf(t)==='later'&&t.when)meta.push('am '+fmt(t.when));
  const warn=!t.done&&(t.moves||0)>=3;
  return '<div class="pt'+(t.done?' done':'')+'"><button class="ptc" data-act="tkToggle" data-id="'+t.id+'" role="checkbox" aria-checked="'+(!!t.done)+'" aria-label="Erledigt">'+(t.done?'✓':'')+'</button><button class="tkb" data-act="tkOpen" data-id="'+t.id+'"><span class="tkt">'+esc(t.text)+'</span>'+(meta.length?'<span class="im">'+meta.join(', ')+'</span>':'')+(warn?'<span class="fl"><span class="tag stale">'+t.moves+'-mal verschoben</span></span>':'')+'</button></div>';
}
function taskList(list){return '<div class="pts">'+list.map(taskRow).join('')+'</div>'}
function taskSect(title,list){return '<section class="block"><h2>'+title+'</h2>'+taskList(list)+'</section>'}
function vHeute(){
  const td=today(),started=dayStarted(),must=mustTasks(),mustIds=must.map(t=>t.id);
  const tdy=inBucket('today'),tmr=inBucket('tomorrow'),wk=inBucket('week'),lat=inBucket('later');
  let h=storageWarn();
  if(S.inbox.length)h+='<button class="inbox-hint" data-act="go" data-v="inbox">'+S.inbox.length+(S.inbox.length===1?' Notiz wartet':' Notizen warten')+' in der Inbox</button>';
  h+='<div class="ptadd"><input type="text" id="tk-new" placeholder="Neue Aufgabe für heute" aria-label="Neue Aufgabe für heute" autocomplete="off"><button class="btn pri sm" data-act="tkAdd">Hinzufügen</button></div>';
  if(!started&&(tdy.length||wk.length))h+='<section class="notice"><div><strong>Tag starten</strong><p>Wähle bis zu fünf Pflichtaufgaben für heute.</p></div><button class="btn pri" data-act="dayStart">Starten</button></section>';
  if(must.length){const dn=must.filter(t=>t.done).length;h+='<section class="block"><div class="row-actions" style="margin-bottom:8px"><h2 style="margin:0">Pflicht heute</h2><span class="im">'+dn+' von '+must.length+' erledigt</span></div>'+taskList(must)+'<button class="link" data-act="dayStart">Pflichtaufgaben ändern</button></section>'}
  const rest=tdy.filter(t=>!mustIds.includes(t.id));
  if(rest.length)h+=taskSect(must.length?'Weitere Aufgaben heute':'Heute',rest);
  if(tmr.length)h+=taskSect('Morgen',tmr);
  if(wk.length)h+=taskSect('Diese Woche',wk);
  if(lat.length)h+='<details class="block"><summary>Später ('+lat.length+')</summary>'+taskList(lat)+'</details>';
  const doneT=S.tasks.filter(t=>t.done&&t.doneAt&&isoOf(t.doneAt)===td&&!mustIds.includes(t.id));
  if(doneT.length)h+='<details class="block"><summary>Heute erledigt ('+doneT.length+')</summary>'+taskList(doneT)+'</details>';
  if(!S.tasks.some(t=>!t.done)&&!must.length)h+='<p class="calm">Keine offenen Aufgaben. Leg oben eine an, übernimm den nächsten Schritt eines Themas oder bereite ein Meeting nach.</p>';
  h+='<div class="btns" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-act="mtPost">Meeting nachbereiten</button><button class="btn" data-act="recList">Wiederkehrend'+((S.recurring||[]).length?' ('+S.recurring.length+')':'')+'</button>'+(tdy.length||started?'<button class="btn" data-act="dayClose">Tag abschließen</button>':'')+'</div>';
  if(started&&S.day.closed)h+='<p class="im" style="margin-top:10px">Tag abgeschlossen.</p>';
  return h;
}

function render(){

function saveTopic(){
  const title=val('f-title').trim();
  if(!title){toast('Gib dem Thema einen Titel.');$('#f-title').focus();return}
  const on=document.querySelector('#f-status .on');
  const d={title:title,team:val('f-team'),goal:val('f-goal').trim(),status:on?on.dataset.val:'g',next:val('f-next').trim(),due:val('f-due'),waiting:val('f-wait'),waitNote:val('f-waitnote').trim(),notes:val('f-notes'),owner:val('f-owner').trim(),deadline:val('f-deadline'),remind:+val('f-remind'),remindTime:val('f-rtime')||'09:00',followUp:val('f-follow')};
  if(document.getElementById('f-goalid'))d.goalId=val('f-goalid');
  const now=Date.now();
  if(edit&&edit.id){
    const t=S.topics.find(x=>x.id===edit.id);
    if(t){const moved=t.next!==d.next||(t.due||'')!==d.due||t.status!==d.status||t.waiting!==d.waiting;Object.assign(t,d,{updatedAt:now});if(moved)t.progressAt=now}
  }else{
    S.topics.push(Object.assign({id:uid()},d,{created:now,progressAt:now,updatedAt:now,archived:false}));
  }
  if(edit&&edit.fromNote)S.inbox=S.inbox.filter(n=>n.id!==edit.fromNote);
  if(edit&&edit.fromTask)S.tasks=S.tasks.filter(k=>k.id!==edit.fromTask);

}

function rvApply(){
  if(!rv||rv.i>=rv.q.length)return null;
  const t=S.topics.find(x=>x.id===rv.q[rv.i]);if(!t)return null;
  const on=document.querySelector('#r-status .on');
  const st=on?on.dataset.val:t.status, nx=val('r-next').trim(), du=val('r-due'), wt=val('r-wait'), fu=val('r-follow');
  const prog=document.getElementById('r-prog');
  const changed=st!==t.status||nx!==(t.next||'')||du!==(t.due||'')||wt!==(t.waiting||'none')||fu!==(t.followUp||'');
  if(changed||(prog&&prog.checked)){Object.assign(t,{status:st,next:nx,due:du,waiting:wt,followUp:fu,updatedAt:Date.now(),progressAt:Date.now()});rv.changed.add(t.id)}
  save();return t;
}

/* ---------- Kalender ---------- */
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function makeIcs(id,summary,iso,remind,time){
  const d=iso.replace(/-/g,'');
  const n=new Date(iso+'T00:00:00');n.setDate(n.getDate()+1);
  const e=n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const alarm=t=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(summary),'TRIGGER:'+t,'END:VALARM'];
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Themen-Cockpit//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+id+'@themen-cockpit','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+e,'SUMMARY:'+icsEsc(summary),'TRANSP:TRANSPARENT'];
  const p=(time||'09:00').split(':');const mins=Math.min(1439,Math.max(0,(+p[0]||0)*60+(+p[1]||0)));
  if(remind>0)L.push(...alarm('-PT'+(remind*1440-mins)+'M'));
  L.push(...alarm('PT'+mins+'M'));
  L.push('END:VEVENT','END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}

function remDateText(iso,time){const p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0]+' '+(time||'09:00')}
function runShortcut(title,iso,time,force){

/* ---------- Sicherung ---------- */
let dlP=null;
function getDl(){
  if(!dlP)dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
  return dlP;
}
function markExported(){S.lastExport=Date.now();save();render()}
async function doExport(){
  const json=JSON.stringify({app:'themen-cockpit',version:1,exportedAt:new Date().toISOString(),data:S},null,1);
  const fn='themen-cockpit-sicherung-'+today()+'.json';
  const dl=await getDl();
  if(dl){
    try{await dl.save({filename:fn,data:json});markExported();toast('Sicherung gespeichert.');return}
    catch(err){
      const c=err&&err.code;
      if(c==='declined'){toast('Sicherung abgebrochen.');return}
      if(c==='rate_limited'){toast('Kurz warten und erneut versuchen.');return}
    }
  }else if(window.self===window.top){
    try{
      const file=new File([json],fn,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});markExported();toast('Sicherung übergeben.');return}
    }catch(err){if(err&&err.name==='AbortError'){toast('Sicherung abgebrochen.');return}}
    try{
      const u=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),5000);markExported();toast('Sicherung gespeichert.');return;
    }catch(e){}
  }
  sheet('<h2>Sicherung als Text</h2><p>Das direkte Speichern ist hier nicht möglich. Kopiere den Text und sichere ihn in einer Datei auf dem Gerät.</p><textarea id="exp-text" rows="8" readonly>'+esc(json)+'</textarea><div class="sheet-acts" style="margin-top:12px"><button class="btn pri" data-act="copyExp">Text kopieren</button><button class="btn ghost" data-act="close">Schließen</button></div>');
}
function importText(txt){
  let obj;
  try{obj=JSON.parse(txt)}catch(e){toast('Die Datei ist keine gültige Sicherung.');return}
  const d=obj&&obj.data?obj.data:obj;
  if(!d||!Array.isArray(d.topics)){toast('In der Datei wurden keine Themen gefunden.');return}
  const n=normalize(d);
  confirmSheet('Sicherung wiederherstellen?','Die Sicherung enthält '+n.topics.length+' Themen und '+n.inbox.length+' Inbox-Notizen. Alle aktuellen Daten auf diesem Gerät werden ersetzt.','Wiederherstellen',()=>{S=n;save();rv=null;closeSheet();go('lage');toast('Sicherung wiederhergestellt.')});
}

  focusEdit:()=>{const a=active();if(!a.length){toast('Lege zuerst Themen an.');return}const wk=weekKey();const f=S.focus&&S.focus.week===wk.key?S.focus:{top:[],not:''};sheet('<h2>Fokus KW '+wk.w+'</h2><p class="im">Wähle bis zu drei Themen, die diese Woche deine Aufmerksamkeit bekommen.</p><div>'+a.sort(bySev).map(t=>'<label class="chk"><input type="checkbox" class="fchk" value="'+t.id+'"'+(f.top.includes(t.id)?' checked':'')+'><span><span class="sd s-'+t.status+'"></span> '+esc(t.title)+'<br><span class="im">'+who(t)+'</span></span></label>').join('')+'</div><label style="margin-top:14px">Nicht diese Woche<textarea id="f-not" rows="3" placeholder="Was lässt du bewusst liegen?">'+esc(f.not)+'</textarea></label><div class="sheet-acts"><button class="btn pri" data-act="focusSave">Speichern</button><button class="btn ghost" data-act="close">Abbrechen</button></div>')},

  report:()=>{const opts=teamsUsed().filter(tm=>active().some(t=>t.team===tm));sheet('<h2>Statusbericht</h2><label>Umfang<select id="rep-team"><option value="">Alle Teams</option>'+opts.map(tm=>'<option value="'+esc(tm)+'">'+esc(tm)+'</option>').join('')+'</select></label><label class="check" style="margin-bottom:12px"><input type="checkbox" id="rep-names" checked> Verantwortliche nennen</label><textarea id="rep-text" rows="14" readonly>'+esc(buildReport('',true))+'</textarea><p class="im" style="margin-top:8px">Der Text verlässt das Gerät erst, wenn du ihn selbst einfügst oder teilst.</p><div class="sheet-acts"><button class="btn pri" data-act="repCopy">Kopieren</button>'+(navigator.share&&window.self===window.top?'<button class="btn" data-act="repShare">Teilen</button>':'')+'<button class="btn ghost" data-act="close">Schließen</button></div>')},

  scHelp:()=>sheet('<h2>Kurzbefehl einrichten</h2><p class="im">Einmalig, etwa 3 Minuten. Die Bezeichnungen können je nach iOS-Version leicht abweichen.</p><ol class="steps"><li>App <strong>Kurzbefehle</strong> öffnen und oben rechts auf <strong>+</strong> tippen.</li><li>Oben auf den Namen tippen und genau <strong>Cockpit Erinnerung</strong> eintragen.</li><li>Aktion <strong>Text aufteilen</strong> hinzufügen (Suchbegriff „aufteilen“). Als Text <strong>Kurzbefehleingabe</strong> wählen, trennen bei <strong>Neue Zeilen</strong>.</li><li>Aktion <strong>Objekt aus Liste abrufen</strong> hinzufügen und <strong>Erstes Objekt</strong> aus <strong>Aufgeteilter Text</strong> wählen.</li><li>Dieselbe Aktion noch einmal hinzufügen, diesmal <strong>Letztes Objekt</strong> aus <strong>Aufgeteilter Text</strong>.</li><li>Aktion <strong>Neue Erinnerung hinzufügen</strong> hinzufügen (Suchbegriff „Erinnerung“). Als Titel das Ergebnis aus Schritt 4 wählen. Bei <strong>Hinweis</strong> bzw. <strong>Erinnern</strong> ein Datum aktivieren und das Ergebnis aus Schritt 5 einsetzen. Als Liste eine private Liste wählen, zum Beispiel „Cockpit“.</li><li>Auf <strong>Fertig</strong> tippen, zurück in diese App und <strong>Test-Erinnerung anlegen</strong> tippen.</li></ol><p class="im">Falls „Kurzbefehleingabe“ nicht auswählbar ist: im Kurzbefehl unten auf das Info-Symbol tippen und das Empfangen von Eingaben für Text erlauben. Beim ersten Ausführen fragt iOS, ob die App Kurzbefehle öffnen darf. Das bitte erlauben.</p><div class="sheet-acts"><button class="btn pri" data-act="scOk">Kurzbefehl ist eingerichtet</button><button class="btn ghost" data-act="close">Schließen</button></div>'),

  tkAdd:()=>{const v=val('tk-new').trim();if(!v){toast('Die Aufgabe ist leer.');return}newTask(v,'today');save();render();const i=$('#tk-new');if(i)i.focus()},

  tkOpen:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;const cur=t.done?'today':bucketOf(t);sheet('<h2>Aufgabe</h2><label>Text<input type="text" id="tk-text" value="'+esc(t.text)+'"></label><fieldset><legend>Wann</legend><div class="seg seg4" id="tk-when">'+Object.keys(BLABEL).map(k=>'<button type="button" class="segb nod'+(cur===k?' on':'')+'" data-act="seg" data-val="'+k+'" aria-pressed="'+(cur===k)+'">'+BLABEL[k]+'</button>').join('')+'</div></fieldset><label>Gehört zu Thema<select id="tk-topic"><option value="">Kein Thema</option>'+active().sort((x,y)=>x.title.localeCompare(y.title,'de')).map(x=>'<option value="'+x.id+'"'+(x.id===t.topicId?' selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></label><label>Person<input type="text" id="tk-person" list="tk-plist" value="'+esc(t.person||'')+'" autocomplete="off" placeholder="Optional"></label><datalist id="tk-plist">'+personNames().map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>'+((t.moves||0)>=3?'<p class="warnbox">Diese Aufgabe wurde '+t.moves+'-mal verschoben. Ist sie unwichtig, oder steckt eigentlich ein Thema dahinter?</p>':'')+(t.ruleId&&(S.recurring||[]).some(r=>r.id===t.ruleId)?'<button class="link" data-act="recEdit" data-id="'+t.ruleId+'">↻ Wiederholung bearbeiten</button>':'<button class="link" data-act="recEdit" data-from="'+t.id+'">↻ Regelmäßig wiederholen</button>')+'<div class="sheet-acts"><button class="btn pri" data-act="tkSave" data-id="'+t.id+'">Speichern</button><button class="btn ghost" data-act="close">Abbrechen</button></div><div class="danger"><button class="btn sm" data-act="tkDelegate" data-id="'+t.id+'">Delegieren</button><button class="btn sm" data-act="tkToTopic" data-id="'+t.id+'">Zum Thema machen</button><button class="btn sm ghost red" data-act="tkDel" data-id="'+t.id+'">Löschen</button></div>')},
  tkSave:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;const v=val('tk-text').trim();if(!v){toast('Die Aufgabe ist leer.');return}const on=document.querySelector('#tk-when .on');const ob=bucketOf(t);const nb=on?on.dataset.val:ob;if(nb!==ob){if(ob==='today'&&nb!=='today'&&!t.done)t.moves=(t.moves||0)+1;setWhen(t,nb)}t.text=v;t.topicId=val('tk-topic');t.person=val('tk-person').trim();save();closeSheet();render();toast('Gespeichert.')},

  tkDelegate:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;const tp=t.topicId?S.topics.find(x=>x.id===t.topicId&&!x.archived):null;sheet('<h2>Delegieren</h2><p class="im">'+esc(t.text)+'</p><label>An wen?<input type="text" id="dg-person" list="dg-plist" value="'+esc(t.person||'')+'" autocomplete="off" data-focus></label><datalist id="dg-plist">'+personNames().map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist><fieldset><legend>Wie hältst du nach?</legend><label class="chk"><input type="radio" name="dg-mode" value="point" checked><span>Als Gesprächspunkt fürs nächste 1:1</span></label><label class="chk"><input type="radio" name="dg-mode" value="topic"><span>'+(tp?'Am Thema „'+esc(tp.title)+'“ in '+FOLLOW_DAYS+' Tagen nachfassen':'Als Thema mit Nachfassen in '+FOLLOW_DAYS+' Tagen')+'</span></label></fieldset><div class="sheet-acts"><button class="btn pri" data-act="dgSave" data-id="'+t.id+'">Delegieren</button><button class="btn ghost" data-act="close">Abbrechen</button></div>')},
  dgSave:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(!t)return;const p=val('dg-person').trim();if(!p){toast('Gib an, an wen du delegierst.');return}if(p==='__proto__'||p==='constructor'){toast('Dieser Name ist nicht möglich.');return}const m=document.querySelector('input[name="dg-mode"]:checked');const mode=m?m.value:'point';const now=Date.now();const tp=t.topicId?S.topics.find(x=>x.id===t.topicId&&!x.archived):null;
    if(mode==='point'){ensurePerson(p).points.push({id:uid(),text:t.text+(tp?' ('+tp.title+')':''),at:now,done:false})}

    S.tasks=S.tasks.filter(x=>x.id!==t.id);save();closeSheet();render();toast('An '+p+' delegiert.')},
  dayStart:()=>{const c=inBucket('today').concat(inBucket('week'));if(!c.length){toast('Keine offenen Aufgaben für heute oder diese Woche.');return}const pre=mustTasks().map(t=>t.id);sheet('<h2>Tag starten</h2><p class="im">Wähle bis zu fünf Pflichtaufgaben. Die übrigen Aufgaben von heute wandern nach „Diese Woche“.</p><div>'+c.map(t=>'<label class="chk"><input type="checkbox" class="mchk" value="'+t.id+'"'+(pre.includes(t.id)?' checked':'')+'><span>'+esc(t.text)+'<br><span class="im">'+(bucketOf(t)==='today'?(t.when<today()?'übrig seit '+fmt(t.when):'heute'):'diese Woche')+((t.moves||0)>=3?', '+t.moves+'-mal verschoben':'')+'</span></span></label>').join('')+'</div><div class="sheet-acts" style="margin-top:12px"><button class="btn pri" data-act="dayStartSave">Tag starten</button><button class="btn ghost" data-act="close">Abbrechen</button></div>')},
  dayStartSave:()=>{const ids=[...document.querySelectorAll('.mchk:checked')].map(x=>x.value).slice(0,5);S.tasks.forEach(t=>{if(t.done)return;if(ids.includes(t.id)){if(bucketOf(t)!=='today'||t.when<today())setWhen(t,'today')}else if(bucketOf(t)==='today'){setWhen(t,'week')}});S.day={date:today(),must:ids,closed:false};save();closeSheet();render();toast(ids.length?'Los geht’s: '+ids.length+(ids.length===1?' Pflichtaufgabe.':' Pflichtaufgaben.'):'Tag gestartet.')},
  dayClose:()=>{const open=inBucket('today');if(!open.length){S.day=Object.assign(dayStarted()?S.day:{date:today(),must:[]},{closed:true});save();render();toast('Alles erledigt. Schönen Feierabend.');return}sheet('<h2>Tag abschließen</h2><p class="im">Entscheide für jede offene Aufgabe: erledigt, auf morgen oder streichen.</p>'+open.map(t=>'<div class="dcrow"><span>'+esc(t.text)+((t.moves||0)>=2?' <span class="tag stale">'+(t.moves||0)+'-mal verschoben</span>':'')+'</span><div class="seg seg3s" data-id="'+t.id+'">'+[['done','Erledigt'],['tomorrow','Morgen'],['drop','Streichen']].map(o=>'<button type="button" class="segb nod'+(o[0]==='tomorrow'?' on':'')+'" data-act="seg" data-val="'+o[0]+'">'+o[1]+'</button>').join('')+'</div></div>').join('')+'<div class="sheet-acts" style="margin-top:14px"><button class="btn pri" data-act="dayCloseSave">Tag abschließen</button><button class="btn ghost" data-act="close">Abbrechen</button></div>')},
  dayCloseSave:()=>{let n=0;document.querySelectorAll('.seg3s').forEach(g=>{const t=S.tasks.find(x=>x.id===g.dataset.id);if(!t)return;const on=g.querySelector('.on');const v=on?on.dataset.val:'tomorrow';if(v==='done'){t.done=true;t.doneAt=Date.now()}else if(v==='drop'){S.tasks=S.tasks.filter(x=>x.id!==t.id)}else{setWhen(t,'tomorrow');t.moves=(t.moves||0)+1;n++}});S.day=Object.assign(dayStarted()?S.day:{date:today(),must:[]},{closed:true});save();closeSheet();render();toast(n?n+(n===1?' Aufgabe':' Aufgaben')+' auf morgen verschoben. Schönen Feierabend.':'Tag abgeschlossen. Schönen Feierabend.')},
  mtPost:()=>{sheet('<h2>Meeting nachbereiten</h2><label>Termin (optional)<input type="text" id="mp-title" placeholder="z. B. Abstimmung Rollout" data-focus></label><label>Gehört zu Thema (optional)<select id="mp-topic"><option value="">Kein Thema</option>'+active().sort((x,y)=>x.title.localeCompare(y.title,'de')).map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('')+'</select></label><label>Meine Aufgaben und Zusagen<textarea id="mp-mine" rows="4" placeholder="Eine pro Zeile"></textarea></label><label>Fällig<select id="mp-when"><option value="today">Heute</option><option value="tomorrow">Morgen</option><option value="week" selected>Diese Woche</option></select></label><label>Zusagen anderer<textarea id="mp-others" rows="4" placeholder="Name: Zusage, eine pro Zeile"></textarea></label><p class="im" style="margin:-6px 0 14px">Für jede Zusage legt die App eine Nachfass-Aufgabe in '+FOLLOW_DAYS+' Tagen an. Steht ein Name davor, kommt die Zusage außerdem als Punkt ins nächste 1:1.</p><label>Notiz (optional)<textarea id="mp-note" rows="3" placeholder="Ergebnisse, Eindrücke"></textarea></label><div class="sheet-acts"><button class="btn pri" data-act="mpSave">Übernehmen</button><button class="btn ghost" data-act="close">Abbrechen</button></div>')},
  mpSave:()=>{const title=val('mp-title').trim(),tid=val('mp-topic'),mine=lines(val('mp-mine')),oth=lines(val('mp-others')),note=val('mp-note').trim(),wb=val('mp-when')||'week';if(!mine.length&&!oth.length&&!note){toast('Trag mindestens eine Aufgabe, Zusage oder Notiz ein.');return}const src=title?' („'+title+'“)':'';let n=0;
    mine.forEach(l=>{newTask(l,wb,{topicId:tid});n++});
    oth.forEach(l=>{const i=l.indexOf(':');let p='',x=l;if(i>0&&i<=40){p=l.slice(0,i).trim();x=l.slice(i+1).trim()||l}if(p==='__proto__'||p==='constructor')p='';const k=newTask(p?'Nachfassen bei '+p+': '+x:'Nachfassen: '+x,'later',{topicId:tid,person:p});k.when=shiftIso(today(),FOLLOW_DAYS);k.flex=false;n++;if(p)ensurePerson(p).points.push({id:uid(),text:'Zusage'+src+': '+x,at:Date.now(),done:false})});
    if(note){const tp=tid?S.topics.find(x=>x.id===tid):null;const entry=fmt(today())+' Meeting'+(title?' „'+title+'“':'')+': '+note;if(tp){tp.notes=(tp.notes?tp.notes.trimEnd()+String.fromCharCode(10):'')+entry;tp.updatedAt=Date.now()}else S.inbox.push({id:uid(),text:entry,at:Date.now()})}
    save();closeSheet();render();toast(n?n+(n===1?' Aufgabe angelegt.':' Aufgaben angelegt.'):'Notiz gespeichert.')},

  nextToTask:()=>{if(!edit||!edit.id){toast('Speichere das Thema zuerst.');return}const nx=val('f-next').trim();if(!nx){toast('Trag zuerst einen nächsten Schritt ein.');return}if(S.tasks.some(k=>!k.done&&k.topicId===edit.id&&k.text===nx)){toast('Ist schon als Aufgabe angelegt.');return}newTask(nx,'today',{topicId:edit.id});save();toast('Als Aufgabe für heute angelegt.')},

  recEdit:b=>{const id=b.dataset.id||'',from=b.dataset.from||'';const ft=from?S.tasks.find(x=>x.id===from):null;const r=id?(S.recurring||[]).find(x=>x.id===id):{text:ft?ft.text:'',freq:'weekly',weekday:isoDow(today()),monthday:+today().slice(8),interval:2,unit:'day',start:today(),days:[isoDow(today())],topicId:ft?ft.topicId||'':'',person:ft?ft.person||'':''};if(!r)return;
    sheet('<h2>'+(id?'Wiederkehrende Aufgabe':'Neue wiederkehrende Aufgabe')+'</h2><label>Aufgabe<input type="text" id="rr-text" value="'+esc(r.text)+'" placeholder="z. B. Wochenbericht vorbereiten"'+(id||from?'':' data-focus')+'></label><label>Rhythmus<select id="rr-freq">'+Object.keys(FREQ).map(k=>'<option value="'+k+'"'+(r.freq===k?' selected':'')+'>'+FREQ[k]+'</option>').join('')+'</select></label><label id="rr-wd-wrap"'+(r.freq==='weekly'?'':' hidden')+'>Wochentag<select id="rr-wd">'+WD.map((w,i)=>'<option value="'+(i+1)+'"'+((+r.weekday||1)===i+1?' selected':'')+'>'+w+'</option>').join('')+'</select></label><label id="rr-md-wrap"'+(r.freq==='monthly'?'':' hidden')+'>Tag im Monat<select id="rr-md">'+Array.from({length:31},(_,i)=>'<option value="'+(i+1)+'"'+((+r.monthday||1)===i+1?' selected':'')+'>'+(i+1)+'.</option>').join('')+'</select></label><div id="rr-cu-wrap"'+(r.freq==='custom'?'':' hidden')+'><div class="cu-row"><label>Alle<input type="number" id="rr-n" min="1" max="99" inputmode="numeric" value="'+(+r.interval||2)+'"></label><label>Einheit<select id="rr-unit">'+[['day','Tage'],['week','Wochen'],['month','Monate']].map(u=>'<option value="'+u[0]+'"'+((r.unit||'day')===u[0]?' selected':'')+'>'+u[1]+'</option>').join('')+'</select></label></div><label>Beginnt am<input type="date" id="rr-start" value="'+esc(r.start||today())+'"></label><fieldset id="rr-days-wrap"'+((r.unit||'day')==='week'?'':' hidden')+'><legend>An diesen Tagen</legend><div class="wdays">'+WD.map((w,i)=>'<label class="wday"><input type="checkbox" class="rr-day" value="'+(i+1)+'"'+(ruleDays(r).includes(i+1)?' checked':'')+'><span>'+w.slice(0,2)+'</span></label>').join('')+'</div></fieldset><p class="im" style="margin:-4px 0 14px">Bei Monaten zählt der Tag des Startdatums.</p></div><label>Gehört zu Thema (optional)<select id="rr-topic"><option value="">Kein Thema</option>'+active().sort((x,y)=>x.title.localeCompare(y.title,'de')).map(x=>'<option value="'+x.id+'"'+(x.id===r.topicId?' selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></label><label>Person (optional)<input type="text" id="rr-person" list="rr-plist" value="'+esc(r.person||'')+'" autocomplete="off"></label><datalist id="rr-plist">'+personNames().map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist><p class="im" style="margin:-4px 0 14px">Ist die letzte Aufgabe noch offen, kommt keine zweite dazu. Bei „Monatlich am 31.“ nimmt die App in kürzeren Monaten den letzten Tag.</p><div class="sheet-acts"><button class="btn pri" data-act="recSave" data-id="'+id+'" data-from="'+from+'">Speichern</button><button class="btn ghost" data-act="'+(from?'close':'recList')+'">'+(from?'Abbrechen':'Zurück')+'</button></div>'+(id?'<div class="danger"><button class="btn sm ghost red" data-act="recDel" data-id="'+id+'">Wiederholung beenden</button></div>':''))},
  recSave:b=>{const text=val('rr-text').trim();if(!text){toast('Gib der Aufgabe einen Text.');return}const id=b.dataset.id,from=b.dataset.from;const d={text:text,freq:val('rr-freq'),weekday:+val('rr-wd'),monthday:+val('rr-md'),topicId:val('rr-topic'),person:val('rr-person').trim(),interval:Math.max(1,Math.min(99,parseInt(val('rr-n'),10)||1)),unit:val('rr-unit')||'day',start:val('rr-start')||today(),days:[...document.querySelectorAll('.rr-day:checked')].map(x=>+x.value)};if(d.unit==='week'&&!d.days.length)d.days=[isoDow(d.start)];S.recurring=S.recurring||[];let r;
    if(id){r=S.recurring.find(x=>x.id===id);if(!r)return;const changed=r.freq!==d.freq||r.weekday!==d.weekday||r.monthday!==d.monthday||r.interval!==d.interval||r.unit!==d.unit||r.start!==d.start||String(r.days)!==String(d.days);Object.assign(r,d);if(changed){const o=lastOcc(r);r.lastGen=o===today()?'':o}}
    else{r=Object.assign({id:uid()},d);const o=lastOcc(r);r.lastGen=o===today()?'':o;S.recurring.push(r)}
    if(from){const t=S.tasks.find(x=>x.id===from);if(t)t.ruleId=r.id}
    genRecurring();save();if(from)closeSheet();else A.recList();render();toast(ruleText(r)+': gespeichert.')},
  recDel:b=>{S.recurring=(S.recurring||[]).filter(x=>x.id!==b.dataset.id);save();A.recList();render();toast('Wiederholung beendet. Offene Aufgaben bleiben stehen.')},
  search:()=>sheet('<h2>Suche</h2><input type="search" id="sr-q" placeholder="Thema, Person, Stichwort" autocomplete="off" aria-label="Suchbegriff" data-focus><div id="sr-res" style="margin-top:12px">'+searchHtml('')+'</div><button class="btn ghost wide" data-act="close" style="margin-top:16px">Schließen</button>'),
  srOpen:b=>{const k=b.dataset.k;if(k==='t'){openEditor(b.dataset.id)}else if(k==='k'){A.tkOpen(b)}else if(k==='p'){closeSheet();personSel=b.dataset.name;go('personen')}else{closeSheet();go('inbox')}},
  personGo:b=>{personSel=b.dataset.name;go('personen')},
  export:()=>doExport(),
  copyExp:()=>{const ta=$('#exp-text');if(!ta)return;const done=()=>toast('Kopiert.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,()=>{ta.focus();ta.select();toast('Text ist markiert. Tippe auf Kopieren.')})}else{ta.focus();ta.select();toast('Text ist markiert. Tippe auf Kopieren.')}},
  impText:()=>{const t=val('imp-text').trim();if(!t){toast('Füge zuerst den Text der Sicherung ein.');return}importText(t)},
  wipe:()=>confirmSheet('Alle Daten löschen?','Alle Themen und Notizen auf diesem Gerät werden endgültig gelöscht. Erstelle vorher eine Sicherung, wenn du sie behalten willst.','Alles löschen',()=>{S=blank();save();rv=null;closeSheet();go('lage');toast('Alle Daten gelöscht.')})
};

document.addEventListener('click',e=>{
  if(e.target===$('#sheet')){closeSheet();return}
  const b=e.target.closest('[data-act],[data-tab]');
  if(!b||b.disabled)return;
  if(b.dataset.tab){if(b.dataset.tab!=='review'&&rv&&view==='review'){rvApply()}kpiFilter=null;personSel=null;go(b.dataset.tab);return}
  const f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}
});
document.addEventListener('change',e=>{
  const tg=e.target;
  if(tg&&(tg.id==='f-wait'||tg.id==='r-wait')&&tg.value==='others'){const f=document.getElementById(tg.id==='f-wait'?'f-follow':'r-follow');if(f&&!f.value){f.value=shiftIso(today(),FOLLOW_DAYS);toast('Nachfass-Datum in '+FOLLOW_DAYS+' Tagen vorgeschlagen.')}}
  if(tg&&(tg.id==='rep-team'||tg.id==='rep-names')){const r=$('#rep-text');const c=$('#rep-names');if(r)r.value=buildReport(val('rep-team'),!!(c&&c.checked))}
  if(tg&&tg.classList&&tg.classList.contains('fchk')&&tg.checked&&document.querySelectorAll('.fchk:checked').length>3){tg.checked=false;toast('Höchstens drei Themen pro Woche.')}
  if(tg&&tg.classList&&tg.classList.contains('mchk')&&tg.checked&&document.querySelectorAll('.mchk:checked').length>5){tg.checked=false;toast('Höchstens fünf Pflichtaufgaben.')}
  if(tg&&tg.id==='rr-freq'){const w=$('#rr-wd-wrap'),m=$('#rr-md-wrap'),cu=$('#rr-cu-wrap');if(w)w.hidden=tg.value!=='weekly';if(m)m.hidden=tg.value!=='monthly';if(cu)cu.hidden=tg.value!=='custom'}
  if(tg&&tg.id==='rr-unit'){const dw=$('#rr-days-wrap');if(dw)dw.hidden=tg.value!=='week'}
  if(tg&&tg.id==='pr-rhythm'&&personSel){const p=ensurePerson(personSel);const v=+tg.value||0;if(v&&!p.rhythm)p.rhythmSince=Date.now();p.rhythm=v;save();render();toast(v?'Rhythmus: '+rhyLabel(v)+'.':'Kein fester Rhythmus.')}
  if(tg&&tg.id==='pr-role'&&personSel){ensurePerson(personSel).role=tg.value.trim();save()}
  if(e.target&&e.target.id==='imp-file'){
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=()=>importText(String(r.result));r.onerror=()=>toast('Die Datei konnte nicht gelesen werden.');r.readAsText(file);e.target.value='';
  }
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='sr-q'){const r=$('#sr-res');if(r)r.innerHTML=searchHtml(e.target.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();if(e.key==='Enter'&&e.target&&e.target.id==='pt-new'){e.preventDefault();A.ptAdd()}if(e.key==='Enter'&&e.target&&e.target.id==='tk-new'){e.preventDefault();A.tkAdd()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#sheet').hidden&&view!=='review')render()});

if('serviceWorker' in navigator&&window.self===window.top&&location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js').then(()=>{if(view==='daten'&&$('#sheet').hidden)render()}).catch(()=>{});
}
getDl();
render();
})();
</script>
</body>
</html>
