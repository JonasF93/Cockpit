<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Themen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Themen-Cockpit</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EC;--panel:#FFFFFF;--ink:#16232E;--muted:#5A6873;--line:#D5DBD7;
  --accent:#0D6770;--accent-ink:#FFFFFF;--soft:#E1E7E4;
  --g:#2E8857;--y:#CF9700;--r:#C2413A;--hdr:rgba(237,240,236,.9);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B;--panel:#17212A;--ink:#E3E9EC;--muted:#92A1AA;--line:#283640;
    --accent:#4BB0B9;--accent-ink:#04181A;--soft:#1F2C35;
    --g:#4DB07D;--y:#E3B53A;--r:#E46258;--hdr:rgba(14,21,27,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B;--panel:#17212A;--ink:#E3E9EC;--muted:#92A1AA;--line:#283640;
  --accent:#4BB0B9;--accent-ink:#04181A;--soft:#1F2C35;
  --g:#4DB07D;--y:#E3B53A;--r:#E46258;--hdr:rgba(14,21,27,.9);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
h1,h2,.mteam,.big,.btn,.tabs button,.chip,.segb{font-family:"Barlow Semi Condensed","Arial Narrow",-apple-system,BlinkMacSystemFont,sans-serif}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em}
main{max-width:680px;margin:0 auto;padding:18px 16px 84px}
h2{font-size:21px;font-weight:700;margin:0 0 10px}
.block{margin:0 0 28px}
.block p{margin:0 0 10px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding:2px 6px calc(2px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:136px;border:0;background:none;color:var(--muted);font-size:16px;font-weight:600;padding:13px 2px 11px;position:relative;cursor:pointer}
.tabs button.on{color:var(--accent)}
.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:var(--r);color:#fff;font:600 12px/18px -apple-system,BlinkMacSystemFont,sans-serif;vertical-align:1px}

.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;min-height:44px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.red{color:var(--r)}
.btn.sm{font-size:16px;padding:6px 12px;min-height:38px;border-radius:10px}
.btn.wide{width:100%;display:block}
.btn:disabled{opacity:.4;cursor:default}
.link{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:10px 0;cursor:pointer}

.matrix{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mrow{display:grid;grid-template-columns:128px 1fr;align-items:stretch;border-top:1px solid var(--line);min-height:56px}
.mrow:first-child{border-top:0}
.mteam{border:0;border-right:1px solid var(--line);background:none;color:var(--ink);text-align:left;font-size:18px;font-weight:600;padding:12px 10px 12px 14px;display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer;line-height:1.1}
.mteam span{color:var(--muted);font-weight:500;font-size:16px}
.dots{display:flex;flex-wrap:wrap;align-content:center;gap:9px;padding:12px}
.dot{width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--g)}
.dot.s-y{background:var(--y)}.dot.s-r{background:var(--r)}
.dot.flag{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.legend{font-size:13px;color:var(--muted);margin:10px 2px 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--g)}
.legend i.s-y{background:var(--y)}.legend i.s-r{background:var(--r)}
.legend i.flag{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 12px;color:var(--ink);font:inherit;cursor:pointer}
.bar{flex:0 0 5px;border-radius:3px;background:var(--g)}
.bar.s-y{background:var(--y)}.bar.s-r{background:var(--r)}
.ib{display:flex;flex-direction:column;gap:2px;min-width:0}
.it{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.im{color:var(--muted);font-size:14px}
.in{font-size:15px;overflow-wrap:anywhere}
.in.miss{color:var(--muted);font-style:italic}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--ink)}
.tag.over{background:color-mix(in srgb,var(--r) 15%,transparent);color:var(--r)}
.tag.me{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.tag.stale{background:color-mix(in srgb,var(--y) 22%,transparent)}
.tag.dead{background:color-mix(in srgb,var(--y) 32%,transparent);font-weight:600}
.calbox{background:var(--soft);border-radius:12px;padding:12px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px 10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.kpi b{display:block;font-family:"Barlow Semi Condensed","Arial Narrow",-apple-system,sans-serif;font-size:36px;font-weight:700;line-height:1.05}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.r b{color:var(--r)}.kpi.f b{color:#9A7000}.kpi.m b{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.f b{color:var(--y)}}
:root[data-theme="dark"] .kpi.f b{color:var(--y)}
.kpi.zero b{color:var(--muted)}
.calbox .check{margin:10px 0 6px}
.calbox p{margin:0}

.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:16px}
.notice.soft{border-left-color:var(--y)}
.notice p{margin:2px 0 0;color:var(--muted);font-size:15px}
.notice .btn{flex:0 0 auto}
.inbox-hint{display:block;width:100%;text-align:left;background:var(--soft);border:0;border-radius:12px;padding:12px 14px;margin-bottom:16px;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:17px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{font-size:15px;padding:4px 12px}
.row-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

label{display:block;font-size:14px;color:var(--muted);font-weight:600;margin:0 0 14px}
input[type=text],input[type=date],input[type=time],select,textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=date],input[type=time]{min-height:44px;-webkit-appearance:none;appearance:none}
textarea{resize:vertical}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px;padding:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;cursor:pointer}
.segb::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--g)}
.segb.s-y::before{background:var(--y)}.segb.s-r::before{background:var(--r)}
.segb.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--panel)}
.check{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:500;font-size:16px}
.check input{width:22px;height:22px;margin:0;flex:0 0 auto}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--panel);width:100%;max-width:680px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=time],.sheet select,.sheet textarea{background:var(--bg)}
.sheet-acts{display:flex;gap:10px;margin-top:6px}
.sheet-acts .btn{flex:1}
.danger{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.pick{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}

.capture{margin-bottom:22px}
.capture textarea{margin:0 0 10px;background:var(--panel)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note p{margin:0 0 4px;overflow-wrap:anywhere}
.nacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.rvprog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:8px}
.rvprog span{display:block;height:100%;background:var(--accent)}
.rv h2{font-size:27px;margin:6px 0 2px;line-height:1.15;overflow-wrap:anywhere}
.goal{background:var(--soft);border-radius:10px;padding:10px 12px;margin:12px 0}
.rv .fl{margin:10px 0 14px}
.rv-acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:8px}
.big{font-size:60px;font-weight:700;margin:18px 0;line-height:1}
.big span{font-size:21px;font-weight:600;color:var(--muted)}

.empty{text-align:center;padding:48px 12px}
.empty p{color:var(--muted);max-width:34em;margin:0 auto 18px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.calm{color:var(--muted);text-align:center;padding:12px}
.file{position:relative;color:var(--ink);font-size:18px;margin:0 0 10px}
.file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
details summary{color:var(--accent);font-weight:600;padding:8px 0;cursor:pointer}
details textarea{margin-bottom:10px}
.warnbox{background:color-mix(in srgb,var(--r) 14%,var(--panel));border-radius:12px;padding:12px 14px;margin-bottom:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><h1 id="vtitle">Lage</h1><button class="btn pri sm" data-act="quick">+ Notiz</button></div></header>
<main id="main"></main>
<nav class="tabs" aria-label="Bereiche">
  <button data-tab="lage">Lage</button>
  <button data-tab="themen">Themen</button>
  <button data-tab="inbox">Inbox<span id="ibadge"></span></button>
  <button data-tab="review">Review</button>
  <button data-tab="daten">Daten</button>
</nav>
<div id="sheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet-body"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var storageOk=true;
const KEY='themen-cockpit-v1';
const DEFAULT_TEAMS=['Team A','Team B','Team C','Team D'];
const STALE=21;
const ST={g:'Grün',y:'Gelb',r:'Rot'};
const WAIT={none:'Nichts',decision:'Meine Entscheidung oder Freigabe',promise:'Meine Zusage',others:'Andere (intern oder extern)'};
const REMIND=[[0,'Am Tag der Deadline'],[1,'1 Tag vorher'],[3,'3 Tage vorher'],[7,'1 Woche vorher'],[14,'2 Wochen vorher']];
const TITLES={lage:'Lage',themen:'Themen',inbox:'Inbox',review:'Review',daten:'Daten'};

let S=load();
let view='lage', teamFilter='Alle', personFilter='Alle', kpiFilter=null, showArchived=false, rv=null, edit=null, pending=null;

function blank(){return{topics:[],inbox:[],lastReview:null,lastExport:null,teams:DEFAULT_TEAMS.slice()}}
function load(){
  try{
    localStorage.setItem('__tc','1');localStorage.removeItem('__tc');
    const r=localStorage.getItem(KEY);
    if(r){const d=JSON.parse(r);return normalize(d)}
  }catch(e){storageOk=false}
  return blank();
}
function normalize(d){
  const b=blank();
  return{
    topics:Array.isArray(d.topics)?d.topics.filter(t=>t&&t.id&&t.title):[],
    inbox:Array.isArray(d.inbox)?d.inbox.filter(n=>n&&n.id):[],
    lastReview:d.lastReview||b.lastReview,
    lastExport:d.lastExport||b.lastExport,
    teams:(Array.isArray(d.teams)?d.teams.map(x=>String(x).trim()).filter(Boolean):[]).length?d.teams.map(x=>String(x).trim()).filter(Boolean):b.teams
  };
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){storageOk=false;toast('Speichern nicht möglich. Erstelle jetzt eine Sicherung.')}
}

const $=s=>document.querySelector(s);
const val=id=>{const el=document.getElementById(id);return el?el.value:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function days(ts){return ts?Math.floor((Date.now()-ts)/864e5):null}
function fmt(iso){if(!iso)return'';const p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0].slice(2)}
function rel(ts){const d=days(ts);if(d===null)return'nie';if(d<=0)return'heute';if(d===1)return'gestern';return'vor '+d+' Tagen'}
function active(){return S.topics.filter(t=>!t.archived)}
function sev(t){return{r:0,y:1,g:2}[t.status]??2}
function bySev(a,b){return sev(a)-sev(b)||(a.due||'9999').localeCompare(b.due||'9999')||a.title.localeCompare(b.title,'de')}
function minutes(n){return Math.max(5,Math.round(n*0.75))}
function teamsUsed(){const extra=[...new Set(S.topics.map(t=>t.team).filter(x=>x&&!S.teams.includes(x)))];return S.teams.concat(extra)}

function daysUntil(iso){if(!iso)return null;const a=new Date(today()+'T00:00:00'),b=new Date(iso+'T00:00:00');return Math.round((b-a)/864e5)}
function dlText(n){return n<0?'Deadline seit '+(-n)+(n===-1?' Tag':' Tagen')+' überschritten':n===0?'Deadline heute':n===1?'Deadline morgen':'Deadline in '+n+' Tagen'}
function flags(t){
  const f=[];
  const dn=daysUntil(t.deadline);
  if(dn!==null&&(dn<0||dn<=(t.remind??3)))f.push({k:dn<0?'over':'dead',l:dlText(dn)});
  if(t.due&&t.due<today())f.push({k:'over',l:'Meilenstein überschritten'});
  const d=days(t.progressAt);
  if(d!==null&&d>=STALE)f.push({k:'stale',l:d+' Tage ohne Bewegung'});
  if(t.waiting==='decision')f.push({k:'me',l:'Wartet auf deine Entscheidung'});
  if(t.waiting==='promise')f.push({k:'me',l:'Deine Zusage ist offen'});
  return f;
}
function who(t){return t.owner?esc(t.owner)+' ('+esc(t.team)+')':esc(t.team)}
function tags(f){return f.map(x=>'<span class="tag '+x.k+'">'+x.l+'</span>').join('')}

function item(t){
  const f=flags(t);
  let meta=who(t);
  if(t.deadline)meta+=', Deadline '+fmt(t.deadline);
  if(t.due)meta+=', Meilenstein '+fmt(t.due);
  if(t.waiting==='others'&&t.waitNote)meta+=', wartet auf '+esc(t.waitNote);
  return '<button class="item" data-act="open" data-id="'+t.id+'"><span class="bar s-'+t.status+'"></span><span class="ib">'+
    '<span class="it">'+esc(t.title)+'</span><span class="im">'+meta+'</span>'+
    (t.next?'<span class="in">Nächster Schritt: '+esc(t.next)+'</span>':'<span class="in miss">Kein nächster Schritt festgelegt</span>')+
    (f.length?'<span class="fl">'+tags(f)+'</span>':'')+'</span></button>';
}
function sect(title,list){return '<section class="block"><h2>'+title+'</h2><div class="list">'+list.map(item).join('')+'</div></section>'}
function empty(title,text,btns){return '<div class="empty"><h2>'+title+'</h2><p>'+text+'</p><div class="btns">'+btns+'</div></div>'}
function offlineState(){
  if(window.self!==window.top)return'Offline-Nutzung gibt es nur in der Version auf deinem Home-Bildschirm.';
  if(!('serviceWorker' in navigator))return'Dieser Browser unterstützt keine Offline-Nutzung.';
  if(navigator.serviceWorker.controller)return'Offline bereit: Die App startet auch ohne Internet.';
  return'Offline noch nicht eingerichtet. Öffne die App einmal mit Internet, schließe sie und starte sie neu.';
}
function kpiSets(a){return{r:a.filter(t=>t.status==='r'),fr:a.filter(t=>{const n=daysUntil(t.deadline);return n!==null&&n<=14}),me:a.filter(t=>t.waiting==='decision'||t.waiting==='promise')}}
function storageWarn(){return storageOk?'':'<div class="warnbox"><strong>Speicher nicht verfügbar.</strong> Dieser Browser erlaubt kein dauerhaftes Speichern. Öffne die App über den Home-Bildschirm oder in Safari ohne privaten Modus.</div>'}

/* ---------- Ansichten ---------- */
function vLage(){
  const a=active();
  let h=storageWarn();
  if(!a.length&&!S.inbox.length)return h+empty('Noch keine Themen','Lege dein erstes Thema an oder notiere kurz, was gerade ansteht. Einsortieren kannst du später. Eigene Teamnamen vergibst du unter „Daten“.','<button class="btn pri" data-act="new">Thema anlegen</button><button class="btn" data-act="quick">Notiz erfassen</button>');
  if(a.length){const k=kpiSets(a);h+='<div class="kpis">'+[['r','r','kritisch'],['fr','f','Fristen'],['me','m','bei dir']].map(x=>'<button class="kpi '+x[1]+(k[x[0]].length?'':' zero')+'" data-act="kpi" data-k="'+x[0]+'" aria-label="'+k[x[0]].length+' '+x[2]+', Liste anzeigen"><b>'+k[x[0]].length+'</b><span>'+x[2]+'</span></button>').join('')+'</div>'}
  const rd=days(S.lastReview);
  if(a.length&&(rd===null||rd>=7))h+='<section class="notice"><div><strong>Wochen-Review fällig</strong><p>'+(rd===null?'Noch kein Review abgeschlossen.':'Letztes Review '+rel(S.lastReview)+'.')+' '+a.length+' Themen, etwa '+minutes(a.length)+' Minuten.</p></div><button class="btn pri" data-act="go" data-v="review">Starten</button></section>';
  if(S.inbox.length)h+='<button class="inbox-hint" data-act="go" data-v="inbox">'+S.inbox.length+(S.inbox.length===1?' Notiz wartet':' Notizen warten')+' in der Inbox aufs Einsortieren</button>';
  if(a.length){
    h+='<section class="block"><h2>Lagebild</h2><div class="matrix">';
    for(const tm of teamsUsed()){
      const ts=a.filter(t=>t.team===tm).sort(bySev);

      h+='<div class="mrow"><button class="mteam" data-act="team" data-team="'+esc(tm)+'">'+esc(tm)+'<span>'+ts.length+'</span></button><div class="dots">'+
        ts.map(t=>'<button class="dot s-'+t.status+(flags(t).length?' flag':'')+'" data-act="open" data-id="'+t.id+'" aria-label="'+esc(t.title)+', '+ST[t.status]+'" title="'+esc(t.title)+(t.owner?' ('+esc(t.owner)+')':'')+'"></button>').join('')+'</div></div>';
    }
    h+='</div><p class="legend"><span><i></i>läuft</span><span><i class="s-y"></i>Risiko</span><span><i class="s-r"></i>kritisch</span><span><i class="flag"></i>mit Warnung</span></p></section>';
  }
  const fr=a.filter(t=>{const n=daysUntil(t.deadline);return n!==null&&n<=14}).sort((x,y)=>x.deadline.localeCompare(y.deadline));
  if(fr.length)h+=sect('Fristen in den nächsten 14 Tagen',fr);
  const me=a.filter(t=>!fr.includes(t)&&(t.waiting==='decision'||t.waiting==='promise')).sort(bySev);
  if(me.length)h+=sect('Wartet auf dich',me);
  const warn=a.filter(t=>!me.includes(t)&&!fr.includes(t)&&(t.status==='r'||flags(t).length)).sort(bySev);
  if(warn.length)h+=sect('Achtung',warn);
  if(a.length&&!fr.length&&!me.length&&!warn.length)h+='<p class="calm">Keine Warnungen. Alle Themen sind in Bewegung.</p>';

  return h;
}

  const d={title:title,team:val('f-team'),goal:val('f-goal').trim(),status:on?on.dataset.val:'g',next:val('f-next').trim(),due:val('f-due'),waiting:val('f-wait'),waitNote:val('f-waitnote').trim(),notes:val('f-notes'),owner:val('f-owner').trim(),deadline:val('f-deadline'),remind:+val('f-remind'),remindTime:val('f-rtime')||'09:00'};
  const now=Date.now();

    const t=S.topics.find(x=>x.id===edit.id);
    if(t){const moved=t.next!==d.next||(t.due||'')!==d.due||t.status!==d.status||t.waiting!==d.waiting;Object.assign(t,d,{updatedAt:now});if(moved)t.progressAt=now}

}

/* ---------- Kalender ---------- */
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function makeIcs(id,summary,iso,remind,time){
  const d=iso.replace(/-/g,'');
  const n=new Date(iso+'T00:00:00');n.setDate(n.getDate()+1);
  const e=n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const alarm=t=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(summary),'TRIGGER:'+t,'END:VALARM'];
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Themen-Cockpit//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+id+'@themen-cockpit','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+e,'SUMMARY:'+icsEsc(summary),'TRANSP:TRANSPARENT'];
  const p=(time||'09:00').split(':');const mins=Math.min(1439,Math.max(0,(+p[0]||0)*60+(+p[1]||0)));
  if(remind>0)L.push(...alarm('-PT'+(remind*1440-mins)+'M'));
  L.push(...alarm('PT'+mins+'M'));
  L.push('END:VEVENT','END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}

/* ---------- Sicherung ---------- */
let dlP=null;
function getDl(){
  if(!dlP)dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
  return dlP;
}
function markExported(){S.lastExport=Date.now();save();render()}
async function doExport(){
  const json=JSON.stringify({app:'themen-cockpit',version:1,exportedAt:new Date().toISOString(),data:S},null,1);
  const fn='themen-cockpit-sicherung-'+today()+'.json';
  const dl=await getDl();
  if(dl){
    try{await dl.save({filename:fn,data:json});markExported();toast('Sicherung gespeichert.');return}
    catch(err){
      const c=err&&err.code;
      if(c==='declined'){toast('Sicherung abgebrochen.');return}
      if(c==='rate_limited'){toast('Kurz warten und erneut versuchen.');return}
    }
  }else if(window.self===window.top){
    try{
      const file=new File([json],fn,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});markExported();toast('Sicherung übergeben.');return}
    }catch(err){if(err&&err.name==='AbortError'){toast('Sicherung abgebrochen.');return}}
    try{
      const u=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),5000);markExported();toast('Sicherung gespeichert.');return;
    }catch(e){}
  }
  sheet('<h2>Sicherung als Text</h2><p>Das direkte Speichern ist hier nicht möglich. Kopiere den Text und sichere ihn in einer Datei auf dem Gerät.</p><textarea id="exp-text" rows="8" readonly>'+esc(json)+'</textarea><div class="sheet-acts" style="margin-top:12px"><button class="btn pri" data-act="copyExp">Text kopieren</button><button class="btn ghost" data-act="close">Schließen</button></div>');
}
function importText(txt){
  let obj;
  try{obj=JSON.parse(txt)}catch(e){toast('Die Datei ist keine gültige Sicherung.');return}
  const d=obj&&obj.data?obj.data:obj;
  if(!d||!Array.isArray(d.topics)){toast('In der Datei wurden keine Themen gefunden.');return}
  const n=normalize(d);
  confirmSheet('Sicherung wiederherstellen?','Die Sicherung enthält '+n.topics.length+' Themen und '+n.inbox.length+' Inbox-Notizen. Alle aktuellen Daten auf diesem Gerät werden ersetzt.','Wiederherstellen',()=>{S=n;save();rv=null;closeSheet();go('lage');toast('Sicherung wiederhergestellt.')});
}

  quick:()=>sheet('<h2>Notiz erfassen</h2><label class="sr" for="q-text">Notiz</label><textarea id="q-text" rows="4" placeholder="Was ist gerade aufgekommen?" data-focus></textarea><div class="sheet-acts" style="margin-top:12px"><button class="btn pri" data-act="saveQuick">In Inbox ablegen</button><button class="btn ghost" data-act="close">Abbrechen</button></div>'),
  saveQuick:()=>{const t=val('q-text').trim();if(!t){toast('Die Notiz ist leer.');return}S.inbox.push({id:uid(),text:t,at:Date.now()});save();closeSheet();render();toast('In Inbox abgelegt.')},
  addInbox:()=>{const t=val('cap').trim();if(!t){toast('Die Notiz ist leer.');return}S.inbox.push({id:uid(),text:t,at:Date.now()});save();render();toast('In Inbox abgelegt.')},
  new:()=>openEditor(null,{}),
  open:b=>openEditor(b.dataset.id),
  team:b=>{teamFilter=b.dataset.team;personFilter='Alle';kpiFilter=null;showArchived=false;go('themen')},
  kpi:b=>{kpiFilter=b.dataset.k;showArchived=false;go('themen')},
  kpiClear:()=>{kpiFilter=null;render()},
  chip:b=>{teamFilter=b.dataset.team;personFilter='Alle';render()},
  pchip:b=>{personFilter=b.dataset.p;render()},
  arch:()=>{showArchived=!showArchived;render()},
  seg:b=>{b.parentElement.querySelectorAll('.segb').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)})},
  saveTopic:saveTopic,
  close:closeSheet,
  ok:()=>{const cb=pending;pending=null;if(cb)cb()},
  toggleArch:b=>{const t=S.topics.find(x=>x.id===b.dataset.id);if(!t)return;t.archived=!t.archived;t.updatedAt=Date.now();if(!t.archived)t.progressAt=Date.now();save();closeSheet();render();toast(t.archived?'Als erledigt abgelegt.':'Wieder aktiv.')},
  delTopic:b=>{const id=b.dataset.id;const t=S.topics.find(x=>x.id===id);confirmSheet('Thema löschen?','„'+esc(t?t.title:'')+'“ wird endgültig gelöscht. Wenn es nur abgeschlossen ist, lege es besser als erledigt ab.','Löschen',()=>{S.topics=S.topics.filter(x=>x.id!==id);save();closeSheet();render();toast('Thema gelöscht.')})},
  toTopic:b=>{const n=S.inbox.find(x=>x.id===b.dataset.id);if(!n)return;const lines=n.text.split('\n');openEditor(null,{title:lines[0].slice(0,140),notes:lines.slice(1).join('\n').trim()},n.id)},
  attach:b=>{const nid=b.dataset.id;const list=active().sort((x,y)=>x.title.localeCompare(y.title,'de'));sheet('<h2>Zu welchem Thema?</h2><p class="im">Die Notiz wird mit Datum an die Notizen des Themas angehängt.</p><div class="pick">'+list.map(t=>'<button class="item" data-act="attachTo" data-id="'+t.id+'" data-note="'+nid+'"><span class="bar s-'+t.status+'"></span><span class="ib"><span class="it">'+esc(t.title)+'</span><span class="im">'+who(t)+'</span></span></button>').join('')+'</div><button class="btn ghost wide" data-act="close">Abbrechen</button>')},
  attachTo:b=>{const t=S.topics.find(x=>x.id===b.dataset.id),n=S.inbox.find(x=>x.id===b.dataset.note);if(!t||!n)return;const stamp=fmt(today());t.notes=(t.notes?t.notes.trimEnd()+'\n':'')+stamp+': '+n.text;t.updatedAt=Date.now();S.inbox=S.inbox.filter(x=>x.id!==n.id);save();closeSheet();render();toast('An „'+t.title+'“ angehängt.')},
  delNote:b=>{S.inbox=S.inbox.filter(x=>x.id!==b.dataset.id);save();render();toast('Notiz gelöscht.')},
  rvStart:()=>{const q=active().sort((a,b)=>(a.progressAt||0)-(b.progressAt||0)).map(t=>t.id);rv={q:q,i:0,changed:new Set(),done:0};render();window.scrollTo(0,0)},
  rvNext:()=>{rvApply();rv.i++;rvFinishIfDone();render();window.scrollTo(0,0)},
  rvPrev:()=>{rvApply();if(rv.i>0)rv.i--;render();window.scrollTo(0,0)},
  rvDone:()=>{const t=rvApply();if(t){t.archived=true;t.updatedAt=Date.now();rv.done++;save()}rv.i++;rvFinishIfDone();render();window.scrollTo(0,0)},
  rvStop:()=>{rvApply();rv=null;render();toast('Review unterbrochen. Änderungen sind gespeichert.')},
  rvClose:()=>{rv=null;go('lage')},
  teamsEdit:()=>sheet('<h2>Teams bearbeiten</h2><p class="im">Ein Umbenennen gilt auch für alle Themen des Teams. Ein leeres Feld entfernt das Team aus der Auswahl, seine Themen behalten den bisherigen Namen.</p><div id="team-list">'+S.teams.map((t,i)=>'<input type="text" data-i="'+i+'" value="'+esc(t)+'" style="margin-bottom:8px" aria-label="Team '+(i+1)+'">').join('')+'</div><button class="btn sm" data-act="teamAdd">Team hinzufügen</button><div class="sheet-acts" style="margin-top:16px"><button class="btn pri" data-act="teamSave">Speichern</button><button class="btn ghost" data-act="close">Abbrechen</button></div>'),
  teamAdd:()=>{const inp=document.createElement('input');inp.type='text';inp.placeholder='Name des neuen Teams';inp.style.marginBottom='8px';inp.setAttribute('aria-label','Neues Team');$('#team-list').appendChild(inp);inp.focus()},
  teamSave:()=>{const names=[];const ren=[];document.querySelectorAll('#team-list input').forEach(inp=>{const v=inp.value.trim();if(inp.dataset.i!==undefined){const old=S.teams[+inp.dataset.i];if(v&&old!==v)ren.push([old,v])}if(v&&!names.includes(v))names.push(v)});if(!names.length){toast('Mindestens ein Team wird benötigt.');return}ren.forEach(p=>{S.topics.forEach(t=>{if(t.team===p[0])t.team=p[1]});if(teamFilter===p[0])teamFilter=p[1]});S.teams=names;save();closeSheet();render();toast('Teams gespeichert.')},
  cal:()=>{
    const dl=val('f-deadline');
    if(!dl){toast('Setze zuerst eine Deadline.');return}
    if(window.self!==window.top){toast('Kalendereinträge funktionieren nur in der Version auf deinem Home-Bildschirm.');return}
    const title=val('f-title').trim()||'Thema';
    const cb=document.getElementById('f-calname');
    const ics=makeIcs((edit&&edit.id)||uid(),cb&&cb.checked?'Frist: '+title:'Frist im Themen-Cockpit',dl,+val('f-remind'),val('f-rtime'));
    try{const u=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='frist.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);toast('Kalendereintrag erstellt. Bestätige mit „Hinzufügen“.')}
    catch(e){toast('Der Kalendereintrag konnte nicht erstellt werden.')}
  },
  export:()=>doExport(),
  copyExp:()=>{const ta=$('#exp-text');if(!ta)return;const done=()=>toast('Kopiert.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,()=>{ta.focus();ta.select();toast('Text ist markiert. Tippe auf Kopieren.')})}else{ta.focus();ta.select();toast('Text ist markiert. Tippe auf Kopieren.')}},
  impText:()=>{const t=val('imp-text').trim();if(!t){toast('Füge zuerst den Text der Sicherung ein.');return}importText(t)},
  wipe:()=>confirmSheet('Alle Daten löschen?','Alle Themen und Notizen auf diesem Gerät werden endgültig gelöscht. Erstelle vorher eine Sicherung, wenn du sie behalten willst.','Alles löschen',()=>{S=blank();save();rv=null;closeSheet();go('lage');toast('Alle Daten gelöscht.')})
};

document.addEventListener('click',e=>{
  if(e.target===$('#sheet')){closeSheet();return}
  const b=e.target.closest('[data-act],[data-tab]');
  if(!b||b.disabled)return;
  if(b.dataset.tab){if(b.dataset.tab!=='review'&&rv&&view==='review'){rvApply()}kpiFilter=null;go(b.dataset.tab);return}
  const f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='imp-file'){
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=()=>importText(String(r.result));r.onerror=()=>toast('Die Datei konnte nicht gelesen werden.');r.readAsText(file);e.target.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#sheet').hidden&&view!=='review')render()});

if('serviceWorker' in navigator&&window.self===window.top&&location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js').then(()=>{if(view==='daten'&&$('#sheet').hidden)render()}).catch(()=>{});
}
getDl();
render();
})();
</script>
</body>
</html>
